name: Release

# Runs when the addon changes on main: a data update pushed by KeyLootDataMiner, or a change of the code.
# Tests first, then a new version is released as KeyLootMaster-<version>.zip.
on:
  push:
    branches: [ "main" ]
    paths:
      - "KeyLootMaster/**"
      - "tests/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lua runtime for the addon tests
        run: pip install lupa
      - name: Addon tests
        run: python -m unittest discover -s tests -v
      - name: Version
        id: version
        run: echo "tag=v$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Package the addon
        run: |
          version="${{ steps.version.outputs.tag }}"
          sed -i "s/^## Version:.*/## Version: ${version#v}/" KeyLootMaster/KeyLootMaster.toc
          zip -qr "KeyLootMaster-${version}.zip" KeyLootMaster
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.tag }}"
          data_date=$(grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' KeyLootMaster/Data/Meta.lua | head -1)
          gh release create "$version" "KeyLootMaster-${version}.zip" \
            --target "${{ github.sha }}" \
            --title "KeyLootMaster ${version#v}" \
            --notes "Data of ${data_date:-unknown}. Unzip into World of Warcraft/_retail_/Interface/AddOns (the folder inside is KeyLootMaster)."
